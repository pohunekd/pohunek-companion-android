# Settings read by scripts/dev (host-side tooling). Flat `key = value` lines only.

# CPU cores one toolchain container may use (podman --cpus): a positive number.
# 4 keeps a Gradle build from starving the owner's machine.
cpus = 4

# Memory one toolchain container may use (podman --memory): an integer with a
# k, m, or g suffix. Swap is capped to the same amount.
memory = "10g"

# Parallel test JVMs per Gradle test task (maxParallelForks), read by the root
# build.gradle.kts for local runs and CI alike: a positive integer.
test_forks = 2

# scripts/ui-agent: one slot is one scripts/dev container (cpus and memory
# above) holding an emulator, an isolated Pohunek daemon, and a socat bridge.

# Slots that may run at the same time, one per worktree: a positive integer.
slots = 2

# Emulator CPU cores and RAM inside a slot (hw.cpu.ncore, hw.ramSize): positive
# integers; the RAM is in MiB. They are part of the AVD name, so a change
# creates a fresh AVD and quick-boot snapshot on the next start.
emulator_cores = 2
emulator_memory_mb = 2048

# Console port of slot n is emulator_console_port_base + 2n (adb uses the next
# port); the bridge listens on 127.0.0.1:(bridge_port_base + n) inside the
# slot and in the device through `adb reverse`. 18722 is the default port of
# the owner's daemons and must not be used.
emulator_console_port_base = 5554
bridge_port_base = 28722

# The second synthetic host of `ui-agent start --showcase`: its bridge listens on
# showcase_second_host_bridge_port_base + n for slot n, in the slot and in the
# device. The range must not overlap bridge_port_base + 0..slots-1.
showcase_second_host_bridge_port_base = 28822

# Seconds between two blocked showcase sessions starting to wait, so the Needs
# you order is the same on every run: a positive integer.
showcase_blocked_gap_secs = 2

# Seconds to wait for an emulator boot to complete: a positive integer.
boot_timeout_secs = 300

# Emulator screen as WIDTHxHEIGHTxDPI (hw.lcd.*). Small enough to keep software
# rendering and screenshots cheap.
emulator_screen = "720x1600x320"

# The app under test: package and the activity `start` launches (relative to the
# package). The debug build also has .debug.TerminalDemoActivity (a terminal on a local demo session) and
# .debug.GestureDemoActivity (a scratch list for `ui-agent drag`), which are opened with `am start` (see verification.md).
app_package = "dev.pohunek.companion"
launch_activity = ".MainActivity"

# Seconds `scripts/ui-agent start` waits for the device and the daemon (first
# use includes creating the AVD and its snapshot): a positive integer.
start_timeout_secs = 900

# Seconds `scripts/ui-agent health` keeps the request connection open for the
# daemon's reply: a positive integer.
health_wait_secs = 1

# Seconds `scripts/ui-agent stop` waits for the emulator to exit before the
# container is stopped: a positive integer.
shutdown_timeout_secs = 60

# AVD creation (once per AVD name): the avdmanager device profile, the data
# partition size, and seconds to let the system settle before the snapshot.
emulator_device = "pixel_6"
emulator_data_size = "4G"
snapshot_settle_secs = 5

# Synthetic sessions created or removed at the same time: a positive integer.
session_parallelism = 8

# Seconds a stopping slot container gets before it is killed: a positive integer.
container_stop_secs = 10

# Lines printed by `scripts/ui-agent log`: a positive integer.
log_lines = 400

# scripts/ui-agent gestures (swipe, long-press, drag): positive integers.
# Milliseconds a swipe takes.
gesture_swipe_ms = 400
# Milliseconds a swipe --fling takes: short enough that the release velocity starts a fling.
gesture_fling_ms = 120
# Milliseconds a long-press holds; must exceed android_long_press_timeout_ms.
gesture_long_press_ms = 800
# Intermediate move events of a drag between press and release, and the pause
# between two of them in milliseconds.
gesture_drag_steps = 12
gesture_drag_step_ms = 40
# Android's long-press timeout (ViewConfiguration), which gesture_long_press_ms must exceed.
android_long_press_timeout_ms = 500

# Seconds `ui-agent background` waits for the app to leave the screen.
background_settle_secs = 1

# Seconds a one-shot daemon request (`pohunek notification create`) waits for its reply.
daemon_reply_wait_secs = 3

# scripts/ui-agent record: the screenrecord bit rate in bits per second and its
# time limit in seconds (at most 180, the screenrecord maximum), and the seconds
# `record stop` waits for screenrecord to finalize the file: positive integers.
record_bit_rate = 8000000
record_time_limit_secs = 180
record_stop_wait_secs = 10

# scripts/ui-agent click --dwell: milliseconds the finger rests on the element before the tap lands
# (below android_long_press_timeout_ms), so a recording shows the touch before its result.
tap_dwell_ms = 350

# scripts/capture-video: seconds between two scripted actions, so the result of a tap can be read, and the
# longest static stretch inside a clip that is kept whole (at least video_pause_secs).
video_pause_secs = 1.5
video_static_cap_secs = 1.6

# scripts/capture-video touches (scripts/touch-overlay): the emulator draws no touch indicator, so the
# scripted taps and swipes are composited into the recording. A white ring (opacity touch_opacity, a soft
# dark edge of touch_edge_px at touch_edge_opacity) of touch_ring_px pixels and touch_ring_thickness_px
# thickness shows at a tap's point during the dwell and expands to touch_release_scale times its size while
# it fades over touch_release_ms; a swipe is a ring that follows its path. At 720 px width (360 dp) 88 px is
# 44 dp.
touch_ring_px = 88
touch_ring_thickness_px = 7
touch_edge_px = 5
touch_opacity = 0.9
touch_edge_opacity = 0.5
touch_release_scale = 1.8
touch_fade_in_ms = 80
touch_release_ms = 320
# Placement: each gesture is found in the clip itself (scripts/touch-overlay). The device uptime of the
# gesture only gives a window of touch_onset_window_ms around where it should show; the recording's first
# frame lies between the uptime read before `record start` and the one read after it plus
# touch_start_slack_ms. The clip is analysed at 1/touch_scale of its size. A tap's pressed state is the frame
# in which a touch_box_px box around the tap point changes by at least touch_box_threshold (mean gray
# levels) while the rest of the screen changes by at most touch_rest_threshold; a tap without a pressed
# state is placed from the first frame after its lift in which the screen changes by touch_change_threshold,
# touch_render_ms after the finger lifted; a swipe starts at the first frame that changes by
# touch_change_threshold. A gesture with no such frame in its window fails the capture.
touch_render_ms = 60
touch_start_slack_ms = 1500
touch_onset_window_ms = 150
touch_scale = 4
touch_box_px = 160
touch_box_threshold = 2.0
touch_rest_threshold = 0.3
touch_change_threshold = 0.5
