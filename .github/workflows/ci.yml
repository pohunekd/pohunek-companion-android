# One job, `ci`: builds the toolchain image from container/Containerfile and runs
# scripts/gates in it, the same way a local run does.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # scripts/dev passes /dev/kvm through; hosted runners ship it but restrict access.
      - name: Allow access to /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The staged libghostty-vt output is keyed by everything that determines
      # it: the pins in the config, the build script and the toolchain image.
      - name: Restore libghostty-vt
        id: libghostty-vt
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/libghostty-vt
          key: libghostty-vt-${{ hashFiles('config/libghostty-vt.toml', 'scripts/build-libghostty-vt', 'container/Containerfile') }}

      - name: Build libghostty-vt
        if: steps.libghostty-vt.outputs.cache-hit != 'true'
        run: scripts/build-libghostty-vt

      - name: Verify libghostty-vt
        run: scripts/build-libghostty-vt --verify

      - name: Gates
        run: scripts/gates
