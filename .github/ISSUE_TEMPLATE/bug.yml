name: Bug
description: Observed behaviour differs from what is expected
type: Bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: "One or two sentences: what is wrong and where."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: App commit SHA or versionName, Pohunek version of the daemon (`pohunek --version`), Android version, device or emulator image.
      placeholder: |
        - app: <sha>
        - pohunek: 0.x.y
        - Android: 14, Pixel 8 / emulator API 35 x86_64
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact commands and actions from a clean start, so another agent can reproduce it without asking. Include the config used (with no secrets).
      placeholder: |
        1. `pohunek session new ...`
        2. `scripts/ui-agent start`
        3. Tap ... on the session list
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happens instead, with the exact error text.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Log lines, screenshots, CI run links. Mark anything you inferred but did not observe as unconfirmed.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Found while
      description: The issue or PR you were working on, if any, and whether this blocks it.
      placeholder: Found while working on #N; not blocking.
